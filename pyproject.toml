[project]
name = "scrolls"
version = "0.1.0"
description = "Local-first CLI for turning saved internet artifacts into an agent-readable knowledge library."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.109.1",
    "mcp>=1.27.2",
    "pypdf>=6.13.2",
    "trafilatura>=2.1.0",
    "youtube-transcript-api>=1.2.4",
]

[project.scripts]
scrolls = "scrolls.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrolls"]

[tool.pytest.ini_options]
testpaths = ["tests"]
