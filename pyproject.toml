[project]
name = "scrolls"
version = "0.1.0"
description = "Local-first CLI for turning saved internet artifacts into an agent-readable knowledge library."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
scrolls = "scrolls.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrolls"]

[tool.pytest.ini_options]
testpaths = ["tests"]
