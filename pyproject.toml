[project]
name = "scrolls"
version = "0.1.0"
description = "Local-first CLI for turning saved internet artifacts into an agent-readable knowledge library."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.109.1",
    # Chrome encrypts its cookie store; the X collection on-ramp decrypts the
    # session locally (AES-128-CBC). Present transitively via pyjwt[crypto],
    # but declared here because scrolls imports it directly.
    "cryptography>=42",
    "mcp>=1.27.2",
    "pypdf>=6.13.2",
    "trafilatura>=2.1.0",
    "youtube-transcript-api>=1.2.4",
]

[project.scripts]
scrolls = "scrolls.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-socket>=0.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrolls"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite is offline by contract; pytest-socket makes that structural
# rather than a per-test convention (issue #11). Loopback stays open —
# test_http.py and test_x_oauth.py run real localhost servers — and so do
# unix sockets (multiprocessing, asyncio); only the outside world is shut.
addopts = "--disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,::1"
